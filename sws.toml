# Static Web Server config. Only this file is needed beyond env vars, because
# custom response headers (frame-ancestors) have no env-var equivalent in SWS.
#
# Do NOT set SERVER_SECURITY_HEADERS=true in the environment: it forces
# `X-Frame-Options: DENY` and `Content-Security-Policy: frame-ancestors 'self'`,
# which would block your app (a different origin) from framing the editor.

[advanced]

# Apply framing + hardening headers to the HTML documents (the framed page).
[[advanced.headers]]
source = "**/*.html"
[advanced.headers.headers]
# Only app.yourdomain.com may embed this editor in an iframe; all other sites
# are refused. Keep this value in sync with EMBED_PARENT_ORIGIN in the build.
Content-Security-Policy = "frame-ancestors https://app.yourdomain.com"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
